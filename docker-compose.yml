services:
  postgres:
    image: postgres:16-alpine
    container_name: simulation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simulation_center
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simulation-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: simulation-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: simulation_center
      DB_PORT: 5432
      JWT_SECRET: simulation_secret_key_2026
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simulation-network

  nginx:
    image: nginx:alpine
    container_name: simulation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - simulation-network

volumes:
  postgres-data:

networks:
  simulation-network:
    driver: bridge