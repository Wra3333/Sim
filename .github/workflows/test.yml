name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Create .env for tests
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASSWORD=test_password" >> .env
        working-directory: server

      - name: Setup test database
        run: npm run test:setup
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server

      # 🏆 Шаг для вывода подробной сводки
      - name: Show Detailed Coverage Summary
        run: |
          echo "## 📊 📊 📊 Результаты тестов (Backend)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Тесты прошли успешно!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Если lcov.info не найден, wir gehen einfach zur nächsten
          if [ ! -f server/coverage/lcov.info ]; then
            echo "⚠️ **Warnung:** Das Coverage-Datei wurde nicht gefunden." >> $GITHUB_STEP_SUMMARY
            echo "Stellen Sie sicher, dass Jest mit dem Flag `--coverage` gestartet wird." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Выводим полную Liste der Statistik aus lcov.info
          echo "### 🔍 Покрытие по файлам (aus lcov.info)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```text" >> $GITHUB_STEP_SUMMARY
          cat server/coverage/lcov.info 2>/dev/null | grep -E "^(SF|LF|LH|BRF|BRH)" | head -40 >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          
          # Wir benutzen die Traditionelle "Jest Summary"
          echo "### 📈 Statistik für den gesamten Projekt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```text" >> $GITHUB_STEP_SUMMARY
          cat server/coverage/coverage-summary.json 2>/dev/null | json_pp >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
      
      # Загружаем отчет покрытия
      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: server-coverage-report
          path: server/coverage/